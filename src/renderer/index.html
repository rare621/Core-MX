<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' mxb: https: data: file:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'">
  <title>CoreMX</title>
  <link rel="stylesheet" href="styles.css">
  <link rel="stylesheet" href="theme.css">
</head>
<body>
  <div class="startup-screen" id="startupScreen" role="status" aria-live="polite"><div class="startup-mark"><b>CMX</b><span></span></div><div class="startup-name">CoreMX</div><div class="startup-caption">Getting your ride ready</div><div class="startup-progress"><i></i></div></div>
  <div class="ambient" aria-hidden="true"><div class="ambient-img" id="ambientImg"></div></div>
  <header class="titlebar">
    <div class="brand"><img class="brand-icon" src="assets/coremx-icon.png" alt=""><span class="brand-name">CoreMX</span></div>
    <nav class="rail" id="rail" aria-label="Main"></nav>
    <div class="titlebar-spacer"></div>
    <div class="top-account" id="railAccount"></div>
    <button class="btn btn-launch" id="launchBtn" title="Launch MX Bikes"></button>
  </header>

  <div class="shell">
    <main class="content" id="content"></main>
  </div>

  <div class="drawer-scrim" id="drawerScrim"></div>
  <aside class="drawer" id="drawer"></aside>
  <div class="modal-root" id="modalRoot"></div>
  <div class="toasts" id="toasts"></div>
  <div class="dropzone" id="dropzone"><div class="dropzone-inner"><div class="dz-icon"></div><div class="dz-title">Drop to install</div><div class="dz-sub">.pkz, .pnt, .zip, .rar or .7z mod files</div></div></div>

  <script src="icons.js"></script>
  <script src="app.js"></script>
  <script src="online.js"></script>
  <script src="onboarding.js"></script>
  <script src="bike-check.js"></script>
  <script src="live.js"></script>
  <script src="home.js"></script>
  <script src="gamepanel.js"></script>
  <script src="graphicsview.js"></script>
  <script src="ranked.js"></script>
  <script src="host.js"></script>
  <script type="module" src="viewer3d.js"></script>
</body>
</html>
