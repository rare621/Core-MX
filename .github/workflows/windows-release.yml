name: Windows installer

on:
  push:
    tags: ['v*']
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: '24'
          cache: npm
      - run: npm ci
      - name: Check release version
        if: startsWith(github.ref, 'refs/tags/')
        shell: pwsh
        run: |
          $version = (Get-Content package.json | ConvertFrom-Json).version
          if ($env:GITHUB_REF_NAME -ne "v$version") { throw 'Tag must match package.json version' }
      - run: npm test
      - name: Build Windows setup
        run: npm run build:win
      - uses: actions/upload-artifact@v7
        with:
          name: windows-setup
          path: |
            dist/CoreMX-Setup-*.exe
            dist/SHA256SUMS.txt
            dist/CoreMX-server-v*.zip
            dist/latest.yml
          if-no-files-found: error
          retention-days: 14
      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/')
        env:
          GH_TOKEN: ${{ github.token }}
        shell: pwsh
        run: |
          gh release view $env:GITHUB_REF_NAME *> $null
          if ($LASTEXITCODE -eq 0) { Write-Output 'Release already exists; leaving its assets unchanged.'; exit 0 }
          $version = (Get-Content package.json | ConvertFrom-Json).version
          $installer = "dist/CoreMX-Setup-$version-x64.exe"
          $stableInstaller = 'dist/CoreMX-Setup-x64.exe'
          if (-not (Test-Path $installer) -or -not (Test-Path $stableInstaller)) { throw 'Missing versioned or stable CoreMX installer' }
          $serverVersion = [regex]::Match((Get-Content server/mxbm-server.js -Raw), 'const VERSION = (\d+);').Groups[1].Value
          $serverArchive = "dist/CoreMX-server-v$serverVersion.zip"
          if (-not (Test-Path $serverArchive)) { throw "Missing $serverArchive" }
          gh release create $env:GITHUB_REF_NAME $installer $stableInstaller $serverArchive dist/SHA256SUMS.txt dist/latest.yml --verify-tag --title "CoreMX $env:GITHUB_REF_NAME" --notes-file build/release-notes.md
          if ($LASTEXITCODE -ne 0) { throw 'GitHub release creation failed.' }
